<!DOCTYPE html>
<html lang="pr-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Formulário</h1>
        <p>apresentação de uso de formulários</p>
    </header>

    <nav>
        <a href="index.html">inicio</a>
        <a href="video.html">video</a>
        <a href="audio.html">audio</a>
    </nav>

    <main>
        
        <section>
            <h2>Formulário de Contato</h2>
            <p>Preencha esse formulario</p>

            <form action="#" method="post">

                <label for="nome">Nome:</label>
                
                <input type="text" id="nome" name="nome" required>

                <label for="email">Email:</label>

                <input type="email" id="email" name="email" required>

                <label for="nascimento">Data de Nascimento:</label>

                <input type="date" id="nascimento" name="nascimento">

                <label for="personagem">Personagem Favorito:</label>

                <select id="personagem">
                    <option value="tom">Tom</option>
                    <option value="matt">Matt</option>
                    <option value="edd">Edd</option>
                    <option value="tord">Tord</option>
                </select>

                <fieldset>
                    <legend>Recomendaria a serie?</legend>

                    <label class="opcao">
                        <input type="radio" name="recomendaria" value="sim" required> Sim
                    </label>
                    <label class="opcao">
                        <input type="radio" name="recomendaria" value="nao" required> Não
                    </label>
                </fieldset>

                </form>

        </section>

    </main>
    
</body>
</html>
